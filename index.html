<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Schön Autos · Comparar las dos propuestas</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#e4e1da;color:#292a24}.toolbar{height:76px;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid #c1beb4;background:#f9f7f0}.title b{display:block;font-size:15px;letter-spacing:-.3px}.title small{display:block;font-size:10px;color:#62645a;margin-top:6px}.switch{display:flex;gap:6px;padding:4px;background:#e8e5dc;border:1px solid #d0cabc;border-radius:8px}button{font:600 12px Arial,sans-serif;border:0;background:none;padding:12px 18px;cursor:pointer;border-radius:5px;color:#565a4e}button[aria-pressed=true]{background:#272c24;color:white;box-shadow:0 2px 5px #0002}button:focus-visible,a:focus-visible{outline:3px solid #a24d31;outline-offset:3px}.tools{display:flex;align-items:center;gap:12px}.download{font-size:11px;color:#393c32;text-underline-offset:4px}.stage{height:calc(100dvh - 76px);width:100%;display:flex;justify-content:center;background:#e4e1da;padding:0;transition:padding .2s}.stage.mobile{padding:16px}.stage iframe{width:100%;height:100%;border:0;background:white}.stage.mobile iframe{width:390px;max-width:100%;border:1px solid #beb9ae;box-shadow:0 15px 40px #0002;border-radius:14px}iframe[hidden]{display:none}.note{position:fixed;bottom:16px;right:20px;pointer-events:none;background:#ffffffd9;border:1px solid #ddd5c7;color:#5d6352;padding:8px 12px;border-radius:5px;font-size:10px;backdrop-filter:blur(5px)}@media(max-width:780px){.toolbar{height:106px;flex-wrap:wrap;padding:10px 14px;gap:8px}.title b{font-size:13px}.title small{font-size:9px}.switch{order:3;width:100%;justify-content:center}.switch button{flex:1;font-size:11px;padding:10px 7px}.tools{gap:5px}.tools button{display:none}.download{font-size:10px}.stage{height:calc(100dvh - 106px)}.note{display:none}}</style></head><body><div class="toolbar"><div class="title"><b>Schön Autos · Dos direcciones de diseño</b><small>Mismo negocio. Dos formas distintas de presentarlo.</small></div><div class="switch" role="group" aria-label="Elegir diseño"><button data-version="a" aria-pressed="false">A · Estética IA / tecnológica</button><button data-version="b" aria-pressed="true">B · Editorial / taller</button></div><div class="tools"><button id="mobile" aria-pressed="false">Vista móvil</button><a class="download" id="open-version" href="editorial/" target="_blank" rel="noopener">Abrir versión ↗</a></div></div><div class="stage" id="stage"><iframe id="frame-a" title="Versión A, estética tecnológica" hidden></iframe><iframe id="frame-b" title="Versión B, diseño editorial"></iframe></div><div class="note">Prototipos independientes · No modifican la web del taller</div><script>
const urls={a:'ia/',b:'editorial/'};
for(const k of ['a','b']) document.getElementById('frame-'+k).src=urls[k];
function setVersion(k){
  document.querySelectorAll('[data-version]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.version===k)));
  for(const key of ['a','b']) document.getElementById('frame-'+key).hidden=key!==k;
  document.getElementById('open-version').href=urls[k];
}
document.querySelectorAll('[data-version]').forEach(x=>x.addEventListener('click',()=>setVersion(x.dataset.version)));
document.getElementById('mobile').addEventListener('click',e=>{
  const yes=document.getElementById('stage').classList.toggle('mobile');
  e.currentTarget.setAttribute('aria-pressed',String(yes));
  e.currentTarget.textContent=yes?'Vista escritorio':'Vista móvil';
});
setVersion('b');
</script></body></html>
